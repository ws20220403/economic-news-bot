name: Daily Economic News

on:
  schedule:
    - cron: "45,50,55 21 * * *" # 06:45, 06:50, 06:55 KST
    - cron: "*/5 22 * * *" # 07:00-07:55 KST catch-up
    - cron: "0,5,10,15,20,25,30 23 * * *" # 08:00-08:30 KST catch-up
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip Telegram dispatch"
        required: false
        default: "false"

permissions:
  actions: write
  contents: read

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    concurrency:
      group: daily-economic-news-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Decide whether to run
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_EVENT_NAME: ${{ github.event_name }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          event_name = os.environ.get("GH_EVENT_NAME", "")
          dry_run = os.environ.get("DRY_RUN_INPUT", "") == "true"
          now = datetime.now(ZoneInfo("Asia/Seoul"))
          publish_date = now.strftime("%Y-%m-%d")
          should_run = True
          reason = "manual"

          if event_name == "schedule":
              repo = os.environ["GH_REPOSITORY"]
              token = os.environ["GH_TOKEN"]
              artifact_name = "daily-published-{}".format(publish_date)
              query = urllib.parse.urlencode({"name": artifact_name, "per_page": 1})
              url = "https://api.github.com/repos/{}/actions/artifacts?{}".format(repo, query)
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": "Bearer {}".format(token),
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "economic-news-bot",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.loads(response.read().decode("utf-8"))
              if int(data.get("total_count", 0)) > 0:
                  should_run = False
                  reason = "already_published"
              else:
                  reason = "scheduled_publish"

          if event_name == "workflow_dispatch" and dry_run:
              reason = "manual_dry_run"

          print("should_run={}".format("true" if should_run else "false"))
          print("publish_date={}".format(publish_date))
          print("reason={}".format(reason))
          PY

      - name: Print guard decision
        run: |
          echo "should_run=${{ steps.guard.outputs.should_run }}"
          echo "publish_date=${{ steps.guard.outputs.publish_date }}"
          echo "reason=${{ steps.guard.outputs.reason }}"

      - uses: actions/checkout@v6
        if: steps.guard.outputs.should_run == 'true'

      - uses: actions/setup-python@v6
        if: steps.guard.outputs.should_run == 'true'
        with:
          python-version: "3.11"

      - name: Install system fonts
        if: steps.guard.outputs.should_run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install Python dependencies
        if: steps.guard.outputs.should_run == 'true'
        run: python -m pip install -r requirements.txt

      - name: Run tests
        if: steps.guard.outputs.should_run == 'true'
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests

      - name: Run preflight checks
        if: steps.guard.outputs.should_run == 'true'
        env:
          PYTHONPATH: src
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: python -m economic_news_bot.preflight --skip-gemini

      - name: Run daily pipeline
        if: steps.guard.outputs.should_run == 'true'
        env:
          PYTHONPATH: src
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -m economic_news_bot.main --dry-run
          else
            python -m economic_news_bot.main
          fi

      - name: Mark scheduled publish success
        if: steps.guard.outputs.should_run == 'true' && github.event_name == 'schedule'
        run: |
          mkdir -p .publish-state
          echo "${{ steps.guard.outputs.publish_date }}" > ".publish-state/${{ steps.guard.outputs.publish_date }}.txt"

      - uses: actions/upload-artifact@v4
        if: steps.guard.outputs.should_run == 'true' && github.event_name == 'schedule'
        with:
          name: daily-published-${{ steps.guard.outputs.publish_date }}
          path: .publish-state/${{ steps.guard.outputs.publish_date }}.txt
          retention-days: 14
